<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DORIYA - ফ্রি মার্কেটপ্লেস</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- হেডার -->
    <header style="background: #ffffff; padding: 15px; border-bottom: 2px solid #eee; display: flex; justify-content: space-between; align-items: center;">
        <h1 style="color: #ff3e6c; margin: 0; font-size: 24px;">DORIYA</h1>
        <div>
            <button id="authBtn" onclick="openAuthModal()" style="background: #333; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; margin-right: 5px;">
                🔑 লগইন
            </button>
            <button onclick="toggleCart()" style="background: #ff3e6c; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold;">
                🛒 কার্ট (<span id="cartCount">0</span>)
            </button>
        </div>
    </header>

    <!-- প্রোডাক্ট গ্রিড -->
    <main style="max-width: 1100px; margin: 20px auto; padding: 0 15px;">
        <h2 style="color: #333; border-bottom: 2px solid #ff3e6c; display: inline-block; padding-bottom: 5px;">প্রোডাক্ট সমুহ</h2>
        <div id="productGrid" class="product-grid"></div>
    </main>

    <!-- কার্ট সাইডবার -->
    <div id="cartSidebar" style="position: fixed; top: 0; right: -350px; width: 300px; height: 100%; background: white; box-shadow: -2px 0 5px rgba(0,0,0,0.2); transition: 0.3s; padding: 20px; z-index: 1000;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 10px;">
            <h3>🛒 আপনার কার্ট</h3>
            <button onclick="toggleCart()" style="border: none; background: none; font-size: 20px; cursor: pointer;">✕</button>
        </div>
        <div id="cartItems" style="margin-top: 20px;">
            <p>কার্ট খালি</p>
        </div>
        <div style="position: absolute; bottom: 20px; left: 20px; right: 20px;">
            <h4>মোট: ৳ <span id="cartTotal">0</span></h4>
            <button onclick="checkout()" style="background: #25D366; color: white; border: none; width: 100%; padding: 12px; font-weight: bold; border-radius: 5px; cursor: pointer;">চেকআউট করুন</button>
        </div>
    </div>

    <!-- লগইন / সাইনআপ পপ-আপ -->
    <div id="authModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1002; justify-content:center; align-items:center;">
        <div style="background:white; padding:25px; border-radius:10px; width:90%; max-width:350px; position:relative; text-align:center;">
            <button onclick="closeAuthModal()" style="position:absolute; right:15px; top:15px; border:none; background:none; font-size:18px; cursor:pointer;">✕</button>
            <h3 id="authTitle" style="margin-top:0;">লগইন করুন</h3>
            
            <input type="email" id="authEmail" placeholder="ইমেইল এড্রেস" style="width:100%; padding:10px; margin-bottom:10px; box-sizing:border-box;">
            <input type="password" id="authPassword" placeholder="পাসওয়ার্ড" style="width:100%; padding:10px; margin-bottom:10px; box-sizing:border-box;">
            
            <button onclick="handleEmailAuth()" style="background:#ff3e6c; color:white; border:none; width:100%; padding:10px; font-weight:bold; border-radius:5px; cursor:pointer; margin-bottom:10px;">
                প্রবেশ করুন
            </button>
            
            <button onclick="loginWithGoogle()" style="background:#4285F4; color:white; border:none; width:100%; padding:10px; font-weight:bold; border-radius:5px; cursor:pointer; margin-bottom:10px;">
                🌐 Google দিয়ে লগইন
            </button>
            
            <p style="font-size:13px; color:#666;">
                একাউন্ট নেই? <a href="#" onclick="toggleAuthMode()" id="switchAuthText" style="color:#ff3e6c;">রেজিস্ট্রেশন করুন</a>
            </p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAWnJAUA3KF1CwKe5iqdb7ZPOte8GeYIDA",
            authDomain: "doriya-a9f5d.firebaseapp.com",
            databaseURL: "https://doriya-a9f5d-default-rtdb.firebaseio.com",
            projectId: "doriya-a9f5d",
            storageBucket: "doriya-a9f5d.firebasestorage.app",
            messagingSenderId: "751295950502",
            appId: "1:751295950502:web:bdaead1a0826beeda34e6d",
            measurementId: "G-XZV3ECT6G5"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        let isLoginMode = true;

        // Redirect রেজাল্ট চেক করা
        auth.getRedirectResult().then((result) => {
            if (result.user) {
                alert("লগইন সফল হয়েছে!");
            }
        }).catch((error) => {
            if (error.code && error.code !== 'auth/popup-closed-by-user') {
                console.error(error);
            }
        });

        // ইউজার লগইন স্ট্যাটাস চেক
        auth.onAuthStateChanged(user => {
            const authBtn = document.getElementById('authBtn');
            if (user) {
                authBtn.innerText = "👤 " + (user.displayName || user.email.split('@')[0]);
                authBtn.onclick = logoutUser;
            } else {
                authBtn.innerText = "🔑 লগইন";
                authBtn.onclick = openAuthModal;
            }
        });

        function openAuthModal() { document.getElementById('authModal').style.display = 'flex'; }
        function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? "লগইন করুন" : "রেজিস্ট্রেশন করুন";
            document.getElementById('switchAuthText').innerText = isLoginMode ? "রেজিস্ট্রেশন করুন" : "লগইন করুন";
        }

        function handleEmailAuth() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            if(!email || !password) return alert("ইমেইল ও পাসওয়ার্ড লিখুন!");

            if(isLoginMode) {
                auth.signInWithEmailAndPassword(email, password)
                    .then(() => { alert("লগইন সফল!"); closeAuthModal(); })
                    .catch(err => alert("ভুল তথ্য: " + err.message));
            } else {
                auth.createUserWithEmailAndPassword(email, password)
                    .then(() => { alert("রেজিস্ট্রেশন সফল!"); closeAuthModal(); })
                    .catch(err => alert("সমস্যা: " + err.message));
            }
        }

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            // Redirect মেথড ব্যবহার করে মোবাইলের কুকি/স্টোরেজ প্রবলেম বাইপাস করা হলো
            auth.signInWithRedirect(provider);
        }

        function logoutUser() {
            if(confirm("আপনি কি লগআউট করতে চান?")) {
                auth.signOut().then(() => alert("লগআউট হয়েছে!"));
            }
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
